name: Android APK

# Builds one signed universal APK, checks it for the usual sideloading pitfalls,
# installs and starts it on two emulators (Android 8 and 16) and publishes it as a
# GitHub release asset (not as an Actions artifact, which is always zipped).
#
# Signing: repository secrets FAMILYAPP_KEYSTORE_BASE64 and FAMILYAPP_KEYSTORE_PASSWORD.
# Without them the build uses a throwaway key and only publishes a CI test build that
# must not be installed on a phone (it could not be updated later).

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/family-peer/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/family-peer/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_NAME: 0.2.${{ github.run_number }}
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    outputs:
      signed_with_release_key: ${{ steps.signing.outputs.release_key }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          gradle-version: "8.14.3"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILYAPP_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILYAPP_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/familyapp.p12"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "FAMILYAPP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "release_key=true" >> "$GITHUB_OUTPUT"
            echo "Using the release key from repository secrets."
          else
            PW="$(openssl rand -hex 24)"
            echo "::add-mask::$PW"
            keytool -genkeypair -storetype PKCS12 -keystore "$KS" -alias familyapp \
              -keyalg RSA -keysize 2048 -validity 30 -storepass "$PW" -dname "CN=FamilyApp CI throwaway"
            echo "FAMILYAPP_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "release_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release key secrets found. Building with a throwaway key (test build only)."
          fi
          echo "FAMILYAPP_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Unit tests and release APK
        run: |
          set -o pipefail
          mkdir -p ../dist ../logs
          ./gradlew --no-daemon :shared:testDebugUnitTest :shared:jvmTest :androidApp:assembleRelease :shared:assembleDebugAndroidTest \
            -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME 2>&1 | tee ../logs/gradle-build.txt
          cp androidApp/build/outputs/apk/release/androidApp-release.apk ../dist/familyapp-$VERSION_NAME.apk
          # Screen test at 100 % and 200 % font size for the emulator job (quality plan P1-4). Never published.
          mkdir -p ../uitest && cp shared/build/outputs/apk/androidTest/debug/shared-debug-androidTest.apk ../uitest/

      - name: Update probe APK (versionCode + 1, same key)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :androidApp:assembleRelease \
            -PversionCode=$((VERSION_CODE + 1)) -PversionName=$VERSION_NAME-probe 2>&1 | tee ../logs/gradle-probe.txt
          mkdir -p ../probe
          cp androidApp/build/outputs/apk/release/androidApp-release.apk ../probe/update-probe.apk

      - name: End-to-end updater APKs (e2e build type, never published)
        run: |
          set -o pipefail
          mkdir -p ../e2e
          for VC in 100 101; do
            ./gradlew --no-daemon :androidApp:assembleE2e -PversionCode=$VC -PversionName=e2e-$VC 2>&1 | tee -a ../logs/gradle-e2e.txt
            cp androidApp/build/outputs/apk/e2e/androidApp-e2e.apk ../e2e/e2e-$VC.apk
          done
          # Same app, signed with a different key: the updater must refuse it.
          FOREIGN="$RUNNER_TEMP/foreign.p12"
          FPW="$(openssl rand -hex 24)"
          keytool -genkeypair -storetype PKCS12 -keystore "$FOREIGN" -alias familyapp \
            -keyalg RSA -keysize 2048 -validity 30 -storepass "$FPW" -dname "CN=Foreign key"
          FAMILYAPP_KEYSTORE_PATH="$FOREIGN" FAMILYAPP_KEYSTORE_PASSWORD="$FPW" \
            ./gradlew --no-daemon :androidApp:assembleE2e -PversionCode=102 -PversionName=e2e-102 2>&1 | tee -a ../logs/gradle-e2e.txt
          cp androidApp/build/outputs/apk/e2e/androidApp-e2e.apk ../e2e/e2e-102-foreign.apk
          ls -la ../e2e

      - name: Share test sender APK (e2eShareSource, test only, never published)
        run: |
          set -o pipefail
          mkdir -p ../e2e
          ./gradlew --no-daemon :e2eShareSource:assembleDebug 2>&1 | tee ../logs/gradle-share-source.txt
          cp e2eShareSource/build/outputs/apk/debug/e2eShareSource-debug.apk ../e2e/share-source.apk

      - name: Verify APK (apksigner, zipalign, aapt2)
        run: |
          set -o pipefail
          CERT_ARG=""
          if [ "${{ steps.signing.outputs.release_key }}" = "true" ] && [ -f signing/release-cert-sha256.txt ]; then
            CERT_ARG="signing/release-cert-sha256.txt"
          fi
          scripts/verify-apk.sh ../dist/familyapp-$VERSION_NAME.apk $VERSION_CODE $CERT_ARG | tee ../dist/pruefbericht-apk.txt
          (cd ../dist && sha256sum familyapp-$VERSION_NAME.apk > familyapp-$VERSION_NAME.apk.sha256)

      - name: Write update.json (read by the in-app updater, ADR 0005)
        run: |
          APK=../dist/familyapp-$VERSION_NAME.apk
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/RespawnedGuy/familyapp-releases/releases/download/v$VERSION_NAME/familyapp-$VERSION_NAME.apk" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s "$APK")" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256, sizeBytes: $sizeBytes, minSdk: 26, releaseNotes: ""}' \
            > ../dist/update.json
          cat ../dist/update.json

      - name: Fetch previous release APK for the update test
        if: steps.signing.outputs.release_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ../probe/previous
          if TAG="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null)" && [ -n "$TAG" ]; then
            gh release download "$TAG" -R "${{ github.repository }}" --pattern 'familyapp-*.apk' --dir ../probe/previous
            echo "Previous release: $TAG"
          else
            echo "No previous release yet."
          fi

      - name: House device program for the pairing test (tools/family-peer, Maven Central only)
        working-directory: tools/family-peer
        run: |
          set -o pipefail
          gradle --no-daemon -q installDist 2>&1 | tee -a ../../logs/gradle-family-peer.txt
          mkdir -p ../../peer && cp -r build/install/family-peer/. ../../peer/

      - name: Gradle reports on failure
        if: failure()
        run: |
          mkdir -p ../logs
          find . -path '*/build/reports/*' -name '*.html' -size -2M -exec cp --parents {} ../logs/ \; || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build
          path: |
            dist/
            probe/
            e2e/
            uitest/
            peer/
            logs/
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: build

      # The house device program (pairing test) runs on the runner and needs Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, start and update on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # The runner executes each line with sh, so pipefail needs an explicit bash.
          # Every test runs even if an earlier one fails (one red test must not hide the others);
          # the last line fails the step if any of them failed.
          # Smoke test, pairing with the house device program, cold-start measurement (P1-10), hostile shares from other apps (threat model),
          # the in-app updater end to end (wrong checksum, foreign key, real update),
          # then every screen at 100 % and 200 % font size with screenshots (quality plan P1-4).
          script: |
            rm -f emulator-failed
            bash -c 'set -o pipefail; bash app/scripts/emulator-smoke.sh "dist/familyapp-${{ env.VERSION_NAME }}.apk" probe/update-probe.apk emulator-out "$(ls probe/previous/*.apk 2>/dev/null | head -1)" 2>&1 | tee emulator-out-report.txt' || touch emulator-failed
            bash -c 'set -o pipefail; chmod +x peer/bin/family-peer; bash app/scripts/emulator-pairing-e2e.sh peer/bin/family-peer emulator-out 2>&1 | tee emulator-out-pairing.txt' || touch emulator-failed
            bash -c 'set -o pipefail; bash app/scripts/emulator-perf.sh emulator-out 10 2>&1 | tee emulator-out-perf.txt' || touch emulator-failed
            bash -c 'set -o pipefail; bash app/scripts/emulator-share-e2e.sh e2e/share-source.apk emulator-out 2>&1 | tee emulator-out-share.txt' || touch emulator-failed
            bash -c 'set -o pipefail; bash app/scripts/emulator-update-e2e.sh e2e emulator-out 2>&1 | tee emulator-out-e2e.txt' || touch emulator-failed
            bash -c 'set -o pipefail; bash app/scripts/emulator-font-scale.sh uitest/shared-debug-androidTest.apk emulator-out 2>&1 | tee emulator-out-schrift.txt' || touch emulator-failed
            test ! -f emulator-failed

      - name: Collect report
        if: always()
        run: |
          mkdir -p emulator-out
          [ -f emulator-out-report.txt ] && mv emulator-out-report.txt emulator-out/pruefbericht-emulator-api${{ matrix.api-level }}.txt || true
          [ -f emulator-out-pairing.txt ] && mv emulator-out-pairing.txt emulator-out/pruefbericht-kopplung-api${{ matrix.api-level }}.txt || true
          [ -f emulator-out-share.txt ] && mv emulator-out-share.txt emulator-out/pruefbericht-teilen-api${{ matrix.api-level }}.txt || true
          [ -f emulator-out-e2e.txt ] && mv emulator-out-e2e.txt emulator-out/pruefbericht-update-e2e-api${{ matrix.api-level }}.txt || true
          [ -f emulator-out-schrift.txt ] && mv emulator-out-schrift.txt emulator-out/pruefbericht-schrift-api${{ matrix.api-level }}.txt || true
          [ -f emulator-out-perf.txt ] && mv emulator-out-perf.txt emulator-out/pruefbericht-leistung-api${{ matrix.api-level }}.txt || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: emulator-api${{ matrix.api-level }}
          path: emulator-out/
          if-no-files-found: ignore

  publish:
    needs: [build, emulator]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RELEASES_REPO_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      # Branch names come from the PR author: pass them as data, never expand them into the script.
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: in

      - name: Assemble release files
        run: |
          mkdir -p out
          cp in/build/dist/* out/ 2>/dev/null || true
          for d in in/emulator-api*; do
            [ -d "$d" ] || continue
            api="${d##*-}"
            cp "$d"/pruefbericht-*.txt out/ 2>/dev/null || true
            cp "$d"/screen-*.png "$d"/e2e-*.png out/ 2>/dev/null || true
            # Screenshots of every screen at 100 % and 200 % font size, light and dark (P1-4).
            [ -d "$d/schrift-$api" ] && (cd "$d" && zip -qr "../../out/schrift-screenshots-$api.zip" "schrift-$api") || true
            cp "$d"/leistung-*.csv out/ 2>/dev/null || true
          done
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.emulator.result }}" != "success" ]; then
            (cd in && find . -path '*/logs/*' -type f | zip -q -@ ../out/ci-logs.zip) || true
            for d in in/emulator-api*; do cp "$d"/logcat-*.txt out/ 2>/dev/null || true; done
          fi
          ls -la out

      - name: Publish
        run: |
          set -euo pipefail
          OK=false
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.emulator.result }}" = "success" ]; then OK=true; fi
          RELEASE_KEY="${{ needs.build.outputs.signed_with_release_key }}"

          if [ "$OK" = true ] && [ "$RELEASE_KEY" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="v$VERSION_NAME"
            NAME="FamilyApp $VERSION_NAME"
            PRERELEASE=false
            BODY="Installierbare APK für Android 8.0 und neuer. Anleitung: docs/android-installieren.md. Prüfberichte (Signatur, Manifest, Emulator Android 8 und 16, Leistung) hängen an."
          else
            BRANCH="$BRANCH_NAME"
            TAG="ci-$(echo "$BRANCH" | tr -c 'a-zA-Z0-9.-' '-' | sed 's/-*$//')"
            NAME="CI-Testbuild $BRANCH (nicht auf dem Handy installieren)"
            PRERELEASE=true
            BODY="Automatischer Testbuild, Run ${{ github.run_number }}, Commit ${{ github.sha }}. Build: ${{ needs.build.result }}, Emulator: ${{ needs.emulator.result }}, Release-Schlüssel: ${RELEASE_KEY:-unbekannt}. Nicht installieren: mit Wegwerf-Schlüssel signiert oder nicht vollständig geprüft."
            # Replace the previous test build of this branch.
            if OLD_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq .id 2>/dev/null)" && [ -n "$OLD_ID" ]; then
              gh api -X DELETE "repos/$REPO/releases/$OLD_ID"
            fi
            gh api -X DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          fi

          REL="$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f target_commitish="${{ github.sha }}" \
            -f name="$NAME" -f body="$BODY" -F prerelease=$PRERELEASE -f make_latest=$([ "$PRERELEASE" = false ] && echo true || echo false))"
          UPLOAD_URL="$(echo "$REL" | jq -r .upload_url | sed 's/{.*}//')"

          for f in out/*; do
            case "$f" in
              *.apk) CT="application/vnd.android.package-archive" ;;
              *.png) CT="image/png" ;;
              *.zip) CT="application/zip" ;;
              *.json) CT="application/json" ;;
              *.csv) CT="text/csv; charset=utf-8" ;;
              *) CT="text/plain; charset=utf-8" ;;
            esac
            curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: $CT" \
              --data-binary @"$f" "$UPLOAD_URL?name=$(basename "$f")" > /dev/null
            echo "uploaded $(basename "$f") as $CT"
          done

          # Public update channel: only the APK and its metadata, never reports or code.
          if [ "$OK" = true ] && [ "$PRERELEASE" = false ]; then
            if [ -n "$RELEASES_REPO_TOKEN" ]; then
              PUB="RespawnedGuy/familyapp-releases"
              # A release needs a commit to tag; a freshly created empty repo has none.
              if ! GH_TOKEN="$RELEASES_REPO_TOKEN" gh api "repos/$PUB/commits?per_page=1" >/dev/null 2>&1; then
                README="$(printf '%s\n' '# FamilyApp – Releases' '' 'Nur fertige, signierte Android-APKs der FamilyApp mit Prüfsumme und update.json.' 'Die App aktualisiert sich darüber selbst. Der Quellcode liegt nicht hier.' | base64 -w0)"
                GH_TOKEN="$RELEASES_REPO_TOKEN" gh api -X PUT "repos/$PUB/contents/README.md" \
                  -f message="Add README" -f content="$README" >/dev/null
                echo "initialised $PUB with a README"
              fi
              PREL="$(GH_TOKEN="$RELEASES_REPO_TOKEN" gh api "repos/$PUB/releases" -f tag_name="$TAG" \
                -f name="$NAME" -f body="Installierbare APK für Android 8.0 und neuer. Die App aktualisiert sich über update.json selbst." \
                -F prerelease=false -f make_latest=true)"
              PUPLOAD="$(echo "$PREL" | jq -r .upload_url | sed 's/{.*}//')"
              for f in out/familyapp-*.apk out/familyapp-*.apk.sha256 out/update.json; do
                case "$f" in
                  *.apk) CT="application/vnd.android.package-archive" ;;
                  *.json) CT="application/json" ;;
                  *) CT="text/plain; charset=utf-8" ;;
                esac
                curl -sSf -X POST -H "Authorization: Bearer $RELEASES_REPO_TOKEN" -H "Content-Type: $CT" \
                  --data-binary @"$f" "$PUPLOAD?name=$(basename "$f")" > /dev/null
                echo "published $(basename "$f") to $PUB"
              done
            else
              echo "::warning::RELEASES_REPO_TOKEN missing: release not published to the public update channel."
            fi
          fi

          {
            echo "### $NAME"
            echo "Build: ${{ needs.build.result }} · Emulator: ${{ needs.emulator.result }} · Release-Schlüssel: ${RELEASE_KEY:-?}"
            echo "Release: $(echo "$REL" | jq -r .html_url)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$OK" = true ]
