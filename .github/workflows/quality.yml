name: Quality gate

# Quality plan P1-2/P1-3 (docs/qualitaet/iso-25010-bewertung.md): unit tests of the Compose-free
# layers, line and branch coverage floor and detekt with baseline. Runs as plain Kotlin/JVM in
# tools/quality-check, so it needs no Android SDK and finishes in about two minutes.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/quality-check/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "app/**"
      - "tools/quality-check/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/quality-check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Tests, coverage floor, detekt
        run: gradle --no-daemon check

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: quality-reports
          path: |
            tools/quality-check/build/reports/
            tools/quality-check/build/test-results/
          if-no-files-found: ignore
